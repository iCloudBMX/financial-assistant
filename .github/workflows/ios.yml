name: iOS build (unsigned)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --config-only
      - name: Build unsigned app
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_unsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios_unsigned/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qr FinancialAssistant.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FinancialAssistant-ipa
          path: FinancialAssistant.ipa
